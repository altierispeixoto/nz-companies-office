services:
  neo4j:
    image: neo4j:5.26.28-community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password
      # Only enable plugins you need. GDS is memory-heavy; comment out if unused.
      NEO4J_PLUGINS: '["apoc"]'
      # Dev-friendly memory settings (adjust if working with the full 2M-row dataset)
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_memory_transaction_total_max: 2G
    volumes:
      - neo4j_data:/data
      # Logs are ephemeral in dev — survive restarts but not container removal
      - neo4j_logs:/logs
      # NZ_CO_DATA_DIR must be set explicitly (e.g. ./data/gold/_neo4j_export/202611,
      # written by `just pipeline <month>` -- see .specs/features/medallion-architecture/).
      # No default on purpose: a stale hardcoded month here previously caused Docker to
      # auto-create and own an orphaned data/raw/202606 directory (see CONCERNS.md).
      # Mounted at /import, NOT /var/lib/neo4j/import: the official image's entrypoint
      # recursively chowns $NEO4J_HOME (/var/lib/neo4j) to the neo4j user on every start,
      # which would make this directory unwritable from the host after the first run if
      # mounted inside it. /import is the image's own supported external mount point and
      # is only read, never chowned.
      - ${NZ_CO_DATA_DIR}:/import/companies
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  neo4j_data:
  neo4j_logs:
